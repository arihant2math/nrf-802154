[package]
name = "nrf-802154-sys"
authors = ["Ivan Markov <ivan.markov@sysgrok.com>"]
version = "0.1.0"
edition = "2021"
description = "Low level Rust bindings to the NRF 802.15.4 Radio Driver"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sysgrok/nrf-802154"
readme = "README.md"
keywords = ["nrf", "ieee802154", "thread", "embedded", "no-std"]
categories = ["embedded", "no-std", "hardware-support", "external-ffi-bindings"]
rust-version = "1.93"

include = [
    "./*.md",
    "build.rs",
    "cmake/**",
    "src/**",
    # This crate's own glue headers (`nrfx_glue.h`, freestanding `assert.h`/`string.h`),
    # referenced via `-I./include` by both bindgen and the cmake build.
    "include/**",
    # ARM CMSIS core headers (compiler intrinsics, Cortex-M core + MPU defs) that
    # the nRF MDK and the driver pull in. The `Core/Include` dir is small (~3 MB).
    "third_party/arm/CMSIS_5/LICENSE.txt",
    "third_party/arm/CMSIS_5/CMSIS/Core/Include/**",
    # Nordic nrfx 4.x. The MDK moved under `bsp/stable`; package only the
    # generic closure and the chip closures supported by this crate.
    "third_party/nordic/nrfx/LICENSE",
    "third_party/nordic/nrfx/*.h",
    "third_party/nordic/nrfx/drivers/*.h",
    "third_party/nordic/nrfx/hal/**",
    "third_party/nordic/nrfx/haly/**",
    "third_party/nordic/nrfx/helpers/**",
    "third_party/nordic/nrfx/lib/**",
    "third_party/nordic/nrfx/templates/**",
    "third_party/nordic/nrfx/bsp/stable/*.h",
    "third_party/nordic/nrfx/bsp/stable/soc/**",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf_peripherals.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf_mem.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf_erratas.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/*_erratas.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/compiler_abstraction.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/system_nrf.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/system_nrf52840.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/system_nrf5340_network.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/system_nrf54l.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/system_nrf54h.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf52840*.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf51_to_nrf52840.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf52_to_nrf52840.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf5340_network*.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf54l15*.h",
    # nRF54LM20A application-core MDK closure. These are final-silicon LM20A
    # headers; do not substitute nRF54L15 or the old LM20A ENGA headers.
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf54lm20a*.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/nrf54h20*.h",
    "third_party/nordic/nrfx/bsp/stable/mdk/haltium_interim.h",
    # Nordic nrfxlib: the 802.15.4 driver sources + prebuilt SL static libs
    # (`nrf_802154/**`), plus the MPSL headers the driver includes under
    # `-DCONFIG_MPSL`.
    "third_party/nordic/nrfxlib/LICENSE",
    "third_party/nordic/nrfxlib/nrf_802154/**",
    "third_party/nordic/nrfxlib/mpsl/include/**",
    "third_party/nordic/nrfxlib/mpsl/fem/include/**",
]

[package.metadata.docs.rs]
features = ["nrf52"]
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7em-none-eabihf"]

[features]
nrf52 = []
nrf53 = []
nrf54l-ns = []
nrf54l-s = []
nrf54lm20-app-s = []
nrf54h = []

#[dependencies]
#nrf-mpsl-sys = "0.2.0"

[build-dependencies]
bindgen = "0.72"
doxygen-rs = "0.4.2"
winnow = "0.7.12"
cmake = "0.1.54"
